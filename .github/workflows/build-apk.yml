name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Production Web Bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Initialize & Setup Capacitor Android Platform
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Bappa Locator" "com.bappalocator.app.v2" --web-dir dist
          fi
          rm -rf android
          npx cap add android
          npx cap sync android
          
          # Automatically generate all Android launchers & adaptive XML files using official Capacitor Assets Tool
          mkdir -p assets
          cp public/icon.png assets/icon.png
          npx @capacitor/assets generate --android

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "signing/debug.keystore" ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract Version & Rename APK for Release
        id: release_info
        run: |
          VERSION=$(node -p "require('./version.json').latestVersion")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk bappa-locator-v$VERSION.apk
          echo "FILENAME=bappa-locator-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.VERSION }}
          name: Release ${{ steps.release_info.outputs.VERSION }}
          body: "Automated compiled APK release for Bappa Locator ${{ steps.release_info.outputs.VERSION }}."
          draft: false
          prerelease: false
          files: ${{ steps.release_info.outputs.FILENAME }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
