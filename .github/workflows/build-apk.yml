name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Production Web Bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Sync Web Assets to Capacitor Android
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Bappa Locator" "com.bappalocator.app.v2" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android
          mkdir -p assets
          if [ -f "public/icon.png" ]; then
            cp public/icon.png assets/icon.png
            npx @capacitor/assets generate --android || true
          fi

      - name: Setup Signing Keystore & Synchronize Package Attributes
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore from RELEASE_KEYSTORE_BASE64 GitHub Secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          elif [ -f "android/app/release.keystore" ]; then
            echo "Using persistent repository release.keystore (preserves existing package signature)..."
          else
            echo "Generating consistent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias bappalocator \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass BappaLocatorSecretPassword123! \
              -keypass BappaLocatorSecretPassword123! \
              -dname "CN=BappaLocator, OU=App, O=BappaLocator, L=Hyderabad, S=Telangana, C=IN"
          fi
          # Strictly synchronize version, versionCode and appId across all project manifests
          node scripts/sync-versions.js

      - name: Build Android Release APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleRelease

      - name: Extract Version & Rename Signed APK
        id: release_info
        run: |
          VERSION=$(node -p "require('./version.json').latestVersion")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found signed APK at: $APK_PATH"
          cp "$APK_PATH" "bappa-locator-v$VERSION.apk"
          echo "FILENAME=bappa-locator-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.VERSION }}
          name: Release ${{ steps.release_info.outputs.VERSION }}
          body: "Automated signed APK release for Bappa Locator ${{ steps.release_info.outputs.VERSION }}."
          draft: false
          prerelease: false
          files: ${{ steps.release_info.outputs.FILENAME }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
