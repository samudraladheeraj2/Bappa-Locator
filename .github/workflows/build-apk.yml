name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Production Web Bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Initialize & Setup Capacitor Android Platform
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Bappa Locator" "com.bappalocator.app.v2" --web-dir dist
          fi
          rm -rf android
          npx cap add android
          npx cap sync android
          mkdir -p assets
          cp public/icon.png assets/icon.png
          npx @capacitor/assets generate --android

      - name: Setup Signing Keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias bappalocator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BappaLocatorSecretPassword123! \
            -keypass BappaLocatorSecretPassword123! \
            -dname "CN=BappaLocator, OU=App, O=BappaLocator, L=Hyderabad, S=Telangana, C=IN"

      - name: Configure Gradle Signing
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "BappaLocatorSecretPassword123!"
                      keyAlias "bappalocator"
                      keyPassword "BappaLocatorSecretPassword123!"
                  }
              }
          """
          content = content.replace("buildTypes {", signing + "\n    buildTypes {")
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Extract Version & Rename APK
        id: release_info
        run: |
          VERSION=$(node -p "require('./version.json').latestVersion")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk bappa-locator-v$VERSION.apk 2>/devnull || cp android/app/build/outputs/apk/release/app-release.apk bappa-locator-v$VERSION.apk
          echo "FILENAME=bappa-locator-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.VERSION }}
          name: Release ${{ steps.release_info.outputs.VERSION }}
          body: "Automated signed APK release for Bappa Locator ${{ steps.release_info.outputs.VERSION }}."
          draft: false
          prerelease: false
          files: ${{ steps.release_info.outputs.FILENAME }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
