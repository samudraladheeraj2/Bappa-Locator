name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Permanent Release Keystore Exists
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.keystore ]; then
            echo "Generating persistent keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias bappalocator \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass BappaLocatorSecretPassword123! \
              -keypass BappaLocatorSecretPassword123! \
              -dname "CN=BappaLocator, OU=App, O=BappaLocator, L=Hyderabad, S=Telangana, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "Add permanent release keystore [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.4
          name: "Bappa Locator v1.2.4"
          files: android/app/build/outputs/apk/release/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
