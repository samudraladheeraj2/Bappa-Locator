name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --no-deprecation
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Project Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Application Bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Sync Web Assets to Capacitor Android
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Pandal Hopper" "com.pandalhopper.app" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      - name: Setup Signing Keystore & Synchronize Package Attributes
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore from RELEASE_KEYSTORE_BASE64 GitHub Secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          elif [ -f "android/app/release.keystore" ]; then
            echo "Using existing repository release.keystore..."
          else
            echo "Generating consistent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias bappalocator \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass BappaLocatorSecretPassword123! \
              -keypass BappaLocatorSecretPassword123! \
              -dname "CN=PandalHopper, OU=App, O=PandalHopper, L=Hyderabad, S=Telangana, C=IN"
          fi
          # Strictly synchronize version, versionCode, appId, drawables, and manifest attributes
          node scripts/sync-versions.js

      - name: Clean & Build Android Release APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android clean
          ./android/gradlew -p android assembleRelease --no-daemon

      - name: Extract Version & Package Output
        id: release_info
        run: |
          VERSION=$(node -p "require('./version.json').latestVersion")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found signed APK at: $APK_PATH"
          cp "$APK_PATH" "pandal-hopper-v$VERSION.apk"
          echo "FILENAME=pandal-hopper-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandal-hopper-${{ steps.release_info.outputs.VERSION }}-apk
          path: ${{ steps.release_info.outputs.FILENAME }}
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.VERSION }}
          name: Release ${{ steps.release_info.outputs.VERSION }}
          body: "Official signed Android APK for Pandal Hopper ${{ steps.release_info.outputs.VERSION }}."
          draft: false
          prerelease: false
          files: ${{ steps.release_info.outputs.FILENAME }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
